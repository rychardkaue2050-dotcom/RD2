=<!DOCTYPE html>
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo do Dino</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game">
        <div class="sun"></div>
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="cloud cloud3"></div>
        <div class="mountain mountain1"></div>
        <div class="mountain mountain2"></div>
        <div class="tree tree1">
            <div class="trunk"></div>
            <div class="leaves"></div>
        </div>
        <div class="tree tree2">
            <div class="trunk"></div>
            <div class="leaves"></div>
        </div>

        <div id="hud">
            <div id="playerName"></div>
            <div id="score">🏆 Pontos: 0</div>
            <div id="coins">🪙 0</div>
            <div id="lives">❤️❤️❤️</div>
        </div>

        <div id="player">
            <div class="head"></div>
            <div class="body"></div>
            <div class="leg leg1"></div>
            <div class="leg leg2"></div>
        </div>

        <div id="ground">
            <div class="grass"></div>
        </div>

        <div id="gameOver">
            <h1>GAME OVER</h1>
            <p>Pontuação: <span id="finalScore">0</span></p>
            <p>Moedas: <span id="finalCoins">0</span></p>
            <button onclick="restartGame()">🔄 Jogar novamente</button>
            <button onclick="returnToCrud()">Voltar aos jogadores</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
